corpus_summary: This ontology maps the complex relationships within material science,
  detailing how fundamental materials interact with structural organization and defining
  properties. It explores the physical attributes and theoretical concepts that govern
  the behavior of matter, linking specific materials and inherent structures to measurable
  physical properties. Furthermore, the graph elucidates the relationship between
  advanced characterization techniques and core scientific study, illustrating which
  methodologies analyze, influence, or are essential for the understanding and development
  of novel materials.
