corpus_summary: This ontology models the complex operational domain of military action,
  encompassing the structure of armed forces, governmental authorities, and associated
  organizations. It tracks the deployment of personnel, specialized equipment, and
  naval assets across various locations and facilities, detailing the command relationships,
  reporting chains, and hierarchical appointments that govern military operations.
  Furthermore, it captures the lifecycle of military activity, including the planning
  of procedures, the utilization of intelligence and resources, the engagement with
  targets, and the establishment of operational directives.
