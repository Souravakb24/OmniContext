<!doctype html>
<html><head><meta charset="utf-8"><title>Brand & accents</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; }
  .swatch { border-radius: var(--radius); border: 1px solid var(--mist); overflow: hidden; display: flex; flex-direction: column; }
  .chip { height: 120px; }
  .meta { padding: 10px 12px; background: var(--paper-bright); }
  .meta b { font: 500 14px var(--font-sans); color: var(--ink); display: block; }
  .meta span { font: var(--type-code-sm); color: var(--fg-subtle); }
  .meta em { display: block; font: var(--type-body-sm); color: var(--ink-3); font-style: normal; margin-top: 4px; }
</style></head>
<body>
<div class="card">
  <div class="swatch"><div class="chip" style="background:#2E6F8E"></div><div class="meta"><b>Current</b><span>#2E6F8E</span><em>Primary actions, links</em></div></div>
  <div class="swatch"><div class="chip" style="background:#1B4A63"></div><div class="meta"><b>Current deep</b><span>#1B4A63</span><em>Hover, pressed</em></div></div>
  <div class="swatch"><div class="chip" style="background:#D9B271"></div><div class="meta"><b>Sand</b><span>#D9B271</span><em>Highlights, Pro</em></div></div>
  <div class="swatch"><div class="chip" style="background:#D8E6EC"></div><div class="meta"><b>Current soft</b><span>#D8E6EC</span><em>Selected row tint</em></div></div>
</div>
</body></html>
