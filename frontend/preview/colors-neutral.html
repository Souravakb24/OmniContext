<!doctype html>
<html><head><meta charset="utf-8"><title>Neutral palette</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 20px; }
  .swatch { border-radius: var(--radius); border: 1px solid var(--mist); overflow: hidden; display: flex; flex-direction: column; }
  .chip { height: 88px; }
  .meta { padding: 8px 10px; font: var(--type-body-sm); color: var(--ink); background: var(--paper-bright); }
  .meta b { display: block; font-weight: 500; }
  .meta span { font: var(--type-code-sm); color: var(--fg-subtle); }
</style></head>
<body>
<div class="card">
  <div class="swatch"><div class="chip" style="background:#0E1B2C"></div><div class="meta"><b>Ink</b><span>#0E1B2C</span></div></div>
  <div class="swatch"><div class="chip" style="background:#2A3A4F"></div><div class="meta"><b>Ink 2</b><span>#2A3A4F</span></div></div>
  <div class="swatch"><div class="chip" style="background:#5A6878"></div><div class="meta"><b>Ink 3</b><span>#5A6878</span></div></div>
  <div class="swatch"><div class="chip" style="background:#8A95A3"></div><div class="meta"><b>Ink 4</b><span>#8A95A3</span></div></div>
  <div class="swatch"><div class="chip" style="background:#E7E1D3"></div><div class="meta"><b>Mist</b><span>#E7E1D3</span></div></div>
  <div class="swatch"><div class="chip" style="background:#D8D2C3"></div><div class="meta"><b>Mist 2</b><span>#D8D2C3</span></div></div>
  <div class="swatch"><div class="chip" style="background:#F5F1E8"></div><div class="meta"><b>Paper</b><span>#F5F1E8</span></div></div>
  <div class="swatch"><div class="chip" style="background:#FAF7F0"></div><div class="meta"><b>Paper soft</b><span>#FAF7F0</span></div></div>
  <div class="swatch"><div class="chip" style="background:#FFFEFA"></div><div class="meta"><b>Paper bright</b><span>#FFFEFA</span></div></div>
</div>
</body></html>
