<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { padding: 24px 28px; background: var(--paper); display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  .obj { background: var(--paper-bright); border: 1px solid var(--mist); border-radius: 12px; padding: 20px; }
  .obj .ttl { font: 500 16px var(--font-sans); color: var(--ink); letter-spacing: -0.005em; }
  .obj .desc { font: 400 13px/1.5 var(--font-sans); color: var(--ink-3); margin-top: 4px; }
  .obj .row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .obj .stat { display: flex; gap: 12px; font: 400 12px var(--font-sans); color: var(--ink-3); }
  .obj .stat b { color: var(--ink); font-weight: 500; }
  .obj .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--moss); display: inline-block; margin-right: 6px; vertical-align: middle; }
  .upload { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 28px 20px; border: 1.5px dashed var(--mist-2); border-radius: 12px; background: var(--paper-bright); text-align: center; }
  .upload .ico { width: 32px; height: 32px; color: var(--current); }
  .upload .ttl { font: 500 14px var(--font-sans); color: var(--ink); }
  .upload .hint { font: 400 12px var(--font-sans); color: var(--ink-3); }
</style></head>
<body>
<div class="card">
  <div class="obj">
    <div class="ttl">research-papers</div>
    <div class="desc">Peer-reviewed work on retrieval-augmented systems. 42 documents indexed.</div>
    <div class="row">
      <div class="stat"><span><span class="dot"></span>Healthy</span><span><b>42</b> docs</span><span><b>3.1k</b> chunks</span></div>
      <div class="stat">Updated 2 days ago</div>
    </div>
  </div>
  <div class="upload">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <div class="ttl">Drop a PDF here</div>
    <div class="hint">PDF · DOCX · PPT · PPTX up to 50 MB</div>
  </div>
</div>
</body></html>
