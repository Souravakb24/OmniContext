<!doctype html>
<html><head><meta charset="utf-8"><title>File glyphs</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { padding: 24px 28px; }
  .row { display: flex; gap: 18px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--mist); background: var(--paper-bright); width: 110px; }
  .item img { width: 48px; height: 48px; }
  .item b { font: 500 13px var(--font-sans); color: var(--ink); }
  .item span { font: var(--type-code-sm); color: var(--fg-subtle); }
  .note { margin-top: 14px; font: var(--type-body-sm); color: var(--ink-3); }
  .note b { color: var(--ink); font-weight: 500; }
</style></head>
<body>
<div class="card">
  <div class="row">
    <div class="item"><img src="../assets/file-glyphs/pdf.svg"><b>PDF</b><span>.pdf</span></div>
    <div class="item"><img src="../assets/file-glyphs/docx.svg"><b>Word</b><span>.docx</span></div>
    <div class="item"><img src="../assets/file-glyphs/pptx.svg"><b>Slides</b><span>.pptx · .ppt</span></div>
  </div>
  <div class="note">Custom 24 px line drawings · same 1.5 px stroke as Lucide · file-type tag in <b>type accent colour</b>.</div>
</div>
</body></html>
