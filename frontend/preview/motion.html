<!doctype html>
<html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 110px 1fr 100px; gap: 16px; align-items: center; padding: 8px 0; }
  .row .name { font: 500 13px var(--font-sans); color: var(--ink); }
  .row .track { height: 18px; background: var(--mist); border-radius: 999px; position: relative; overflow: hidden; }
  .row .bead { position: absolute; top: 3px; left: 0; width: 12px; height: 12px; background: var(--current); border-radius: 999px; animation: slide 2.2s var(--ease-flow) infinite; }
  .r2 .bead { animation-duration: 3s; }
  .r3 .bead { animation-duration: 4s; }
  .r4 .bead { animation-duration: 5s; }
  .val { font: var(--type-code-sm); color: var(--fg-subtle); text-align: right; }
  .ease { padding-top: 6px; font: var(--type-code-sm); color: var(--ink-3); border-top: 1px solid var(--mist); margin-top: 10px; }
  .ease b { color: var(--ink); font-weight: 500; font-family: var(--font-sans); }
  @keyframes slide {
    0% { left: 0 }
    50% { left: calc(100% - 12px) }
    100% { left: 0 }
  }
</style></head>
<body>
<div class="card">
  <div class="row"><span class="name">dur-1</span><span class="track"><span class="bead"></span></span><span class="val">120 ms</span></div>
  <div class="row r2"><span class="name">dur-2</span><span class="track"><span class="bead"></span></span><span class="val">200 ms</span></div>
  <div class="row r3"><span class="name">dur-3</span><span class="track"><span class="bead"></span></span><span class="val">400 ms</span></div>
  <div class="row r4"><span class="name">dur-4</span><span class="track"><span class="bead"></span></span><span class="val">600 ms</span></div>
  <div class="ease"><b>ease-flow</b> · cubic-bezier(0.2, 0.8, 0.2, 1)</div>
</div>
</body></html>
