<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 32px 28px; background: var(--paper); }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 100%; height: 88px; background: var(--paper-bright); border-radius: var(--radius-md); border: 1px solid var(--mist); display: flex; align-items: center; justify-content: center; font: 500 13px var(--font-sans); color: var(--ink-3); }
  .name { font: 500 13px var(--font-sans); color: var(--ink); }
  .val { font: var(--type-code-sm); color: var(--fg-subtle); text-align: center; }
</style></head>
<body>
<div class="card">
  <div class="tile">
    <div class="box" style="box-shadow:0 1px 2px rgba(14,27,44,0.04)">card at rest</div>
    <div class="name">shadow-1</div>
    <div class="val">0 1px 2px · 4 %</div>
  </div>
  <div class="tile">
    <div class="box" style="box-shadow:0 4px 16px rgba(14,27,44,0.06)">menu, hover</div>
    <div class="name">shadow-2</div>
    <div class="val">0 4px 16px · 6 %</div>
  </div>
  <div class="tile">
    <div class="box" style="box-shadow:0 16px 48px rgba(14,27,44,0.10)">modal</div>
    <div class="name">shadow-3</div>
    <div class="val">0 16px 48px · 10 %</div>
  </div>
</div>
</body></html>
