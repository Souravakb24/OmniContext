<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 80px 1fr 90px; align-items: center; gap: 16px; padding: 6px 0; }
  .row .name { font: 500 13px var(--font-sans); color: var(--ink); }
  .row .bar { height: 10px; background: var(--current); border-radius: 3px; }
  .row .val { font: var(--type-code-sm); color: var(--fg-subtle); text-align: right; }
</style></head>
<body>
<div class="card">
  <div class="row"><span class="name">space-1</span><span class="bar" style="width:4px"></span><span class="val">4 px</span></div>
  <div class="row"><span class="name">space-2</span><span class="bar" style="width:8px"></span><span class="val">8 px</span></div>
  <div class="row"><span class="name">space-3</span><span class="bar" style="width:12px"></span><span class="val">12 px</span></div>
  <div class="row"><span class="name">space-4</span><span class="bar" style="width:16px"></span><span class="val">16 px</span></div>
  <div class="row"><span class="name">space-5</span><span class="bar" style="width:24px"></span><span class="val">24 px</span></div>
  <div class="row"><span class="name">space-6</span><span class="bar" style="width:32px"></span><span class="val">32 px</span></div>
  <div class="row"><span class="name">space-7</span><span class="bar" style="width:48px"></span><span class="val">48 px</span></div>
  <div class="row"><span class="name">space-8</span><span class="bar" style="width:64px"></span><span class="val">64 px</span></div>
  <div class="row"><span class="name">space-9</span><span class="bar" style="width:96px"></span><span class="val">96 px</span></div>
</div>
</body></html>
