<!doctype html>
<html><head><meta charset="utf-8"><title>UI type scale</title><link rel="stylesheet" href="_preview.css">
<style>
  .card { padding: 22px 28px; }
  .row { display: grid; grid-template-columns: 1fr 140px; gap: 18px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--mist); }
  .row:last-child { border-bottom: none; }
  .specimen { color: var(--ink); }
  .meta { font: var(--type-code-sm); color: var(--fg-subtle); text-align: right; }
</style></head>
<body>
<div class="card">
  <div class="row"><div class="specimen" style="font:600 32px/1.2 'Geist',sans-serif;letter-spacing:-0.01em">Your library</div><div class="meta">H1 · 32/600</div></div>
  <div class="row"><div class="specimen" style="font:600 24px/1.25 'Geist',sans-serif;letter-spacing:-0.01em">Research papers</div><div class="meta">H2 · 24/600</div></div>
  <div class="row"><div class="specimen" style="font:600 18px/1.3 'Geist',sans-serif">Recent uploads</div><div class="meta">H3 · 18/600</div></div>
  <div class="row"><div class="specimen" style="font:400 15px/1.55 'Geist',sans-serif;color:#2A3A4F">InflowMind ingests, parses, and indexes your documents — search results cite the source page directly.</div><div class="meta">Body · 15/400</div></div>
  <div class="row"><div class="specimen" style="font:400 13px/1.5 'Geist',sans-serif;color:#5A6878">Uploaded · 2 minutes ago</div><div class="meta">Body sm · 13/400</div></div>
  <div class="row"><div class="specimen" style="font:500 11px/1.2 'Geist',sans-serif;letter-spacing:0.08em;text-transform:uppercase;color:#5A6878">Collections</div><div class="meta">Overline · 11/500</div></div>
</div>
</body></html>
