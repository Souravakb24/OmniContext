<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1580" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="1580" fill="#0f1117"/>

  <!-- ── Title ── -->
  <text x="450" y="44" text-anchor="middle" font-size="20" font-weight="bold" fill="#e2e8f0">RAG Pipeline — Upload API Flow</text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#64748b">POST /api/v1/upload</text>

  <!-- ═══════════════════════════════════════════════
       CLIENT REQUEST
  ═══════════════════════════════════════════════ -->
  <rect x="300" y="85" width="300" height="54" rx="27" fill="#3b82f6"/>
  <text x="450" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">CLIENT</text>
  <text x="450" y="125" text-anchor="middle" font-size="11" fill="#bfdbfe">POST /api/v1/upload  +  X-API-Key</text>

  <!-- arrow -->
  <line x1="450" y1="139" x2="450" y2="162" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       API KEY AUTH
  ═══════════════════════════════════════════════ -->
  <rect x="310" y="162" width="280" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">API Key Auth</text>
  <text x="450" y="197" text-anchor="middle" font-size="11" fill="#64748b">dependencies.py  →  verify X-API-Key</text>

  <!-- auth fail branch -->
  <line x1="590" y1="184" x2="680" y2="184" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="680" y="168" width="110" height="32" rx="6" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.2"/>
  <text x="735" y="182" text-anchor="middle" font-size="10" fill="#ef4444">401</text>
  <text x="735" y="194" text-anchor="middle" font-size="10" fill="#ef4444">UNAUTHORIZED</text>

  <!-- arrow -->
  <line x1="450" y1="206" x2="450" y2="229" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       PHASE 1 BOX
  ═══════════════════════════════════════════════ -->
  <rect x="80" y="229" width="740" height="242" rx="10" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.8"/>
  <rect x="80" y="229" width="740" height="28" rx="10" fill="#1d4ed8"/>
  <rect x="80" y="247" width="740" height="10" fill="#1d4ed8"/>
  <text x="450" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PHASE 1 — Sequential Checks  (fail-fast, nothing saved yet)</text>

  <!-- C1 -->
  <rect x="120" y="272" width="660" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="120" y="272" width="36" height="38" rx="6" fill="#2563eb"/>
  <text x="138" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">C1</text>
  <text x="138" y="300" text-anchor="middle" font-size="9" fill="#93c5fd">size</text>
  <text x="320" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0">Size Check</text>
  <text x="320" y="302" text-anchor="middle" font-size="10" fill="#64748b">file ≤ 500 MB  (content-length header)</text>
  <text x="660" y="287" text-anchor="middle" font-size="10" fill="#ef4444">FAIL →</text>
  <text x="660" y="300" text-anchor="middle" font-size="10" fill="#ef4444">413 FILE_TOO_LARGE</text>

  <!-- C2 -->
  <rect x="120" y="318" width="660" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="120" y="318" width="36" height="38" rx="6" fill="#2563eb"/>
  <text x="138" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">C2</text>
  <text x="138" y="346" text-anchor="middle" font-size="9" fill="#93c5fd">ext</text>
  <text x="320" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0">Extension Check</text>
  <text x="320" y="348" text-anchor="middle" font-size="10" fill="#64748b">.pdf  .docx  .ppt  .pptx  only</text>
  <text x="660" y="333" text-anchor="middle" font-size="10" fill="#ef4444">FAIL →</text>
  <text x="660" y="346" text-anchor="middle" font-size="10" fill="#ef4444">415 UNSUPPORTED</text>

  <!-- C3 -->
  <rect x="120" y="364" width="660" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="120" y="364" width="36" height="38" rx="6" fill="#2563eb"/>
  <text x="138" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">C3</text>
  <text x="138" y="392" text-anchor="middle" font-size="9" fill="#93c5fd">mime</text>
  <text x="320" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0">MIME Check</text>
  <text x="320" y="394" text-anchor="middle" font-size="10" fill="#64748b">magic bytes match declared extension  (python-magic)</text>
  <text x="660" y="379" text-anchor="middle" font-size="10" fill="#ef4444">FAIL →</text>
  <text x="660" y="392" text-anchor="middle" font-size="10" fill="#ef4444">400 VALIDATION_FAILED</text>

  <!-- C4 -->
  <rect x="120" y="410" width="660" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="120" y="410" width="36" height="38" rx="6" fill="#2563eb"/>
  <text x="138" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">C4</text>
  <text x="138" y="438" text-anchor="middle" font-size="9" fill="#93c5fd">empty</text>
  <text x="320" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0">Empty Check</text>
  <text x="320" y="440" text-anchor="middle" font-size="10" fill="#64748b">file &gt; 4 096 bytes</text>
  <text x="660" y="425" text-anchor="middle" font-size="10" fill="#ef4444">FAIL →</text>
  <text x="660" y="438" text-anchor="middle" font-size="10" fill="#ef4444">400 VALIDATION_FAILED</text>

  <!-- arrow -->
  <line x1="450" y1="471" x2="450" y2="494" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       PHASE 2 BOX
  ═══════════════════════════════════════════════ -->
  <rect x="80" y="494" width="740" height="296" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="80" y="494" width="740" height="28" rx="10" fill="#7c3aed"/>
  <rect x="80" y="512" width="740" height="10" fill="#7c3aed"/>
  <text x="450" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PHASE 2 — Parallel Deep Checks  (ProcessPoolExecutor, max 3 workers)</text>

  <!-- SHA-256 row -->
  <rect x="120" y="537" width="660" height="34" rx="6" fill="#1e1e2e" stroke="#4b5563" stroke-width="1"/>
  <text x="450" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#a78bfa">SHA-256  computed first  (hashlib.sha256 over full file bytes)</text>
  <text x="450" y="564" text-anchor="middle" font-size="10" fill="#6b7280">used for duplicate detection in C7</text>

  <!-- C7 -->
  <rect x="120" y="579" width="660" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="120" y="579" width="36" height="50" rx="6" fill="#7c3aed"/>
  <text x="138" y="597" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">C7</text>
  <text x="138" y="611" text-anchor="middle" font-size="9" fill="#c4b5fd">dup</text>
  <text x="320" y="594" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0">Duplicate Check  (async — Postgres query)</text>
  <text x="320" y="609" text-anchor="middle" font-size="10" fill="#64748b">hash in DB + file on disk  →  409 blocked</text>
  <text x="320" y="622" text-anchor="middle" font-size="10" fill="#f59e0b">hash in DB, file missing  →  re-upload allowed</text>
  <text x="660" y="604" text-anchor="middle" font-size="10" fill="#ef4444">FAIL →</text>
  <text x="660" y="617" text-anchor="middle" font-size="10" fill="#ef4444">409 DUPLICATE</text>

  <!-- parallel label -->
  <text x="450" y="652" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">C5  C6  C8 run concurrently below</text>

  <!-- C5 -->
  <rect x="100" y="660" width="200" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="660" width="200" height="26" rx="8" fill="#065f46"/>
  <rect x="100" y="676" width="200" height="10" fill="#065f46"/>
  <text x="200" y="677" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C5 — Corruption</text>
  <text x="200" y="700" text-anchor="middle" font-size="10" fill="#6ee7b7">PDF → PyMuPDF open</text>
  <text x="200" y="714" text-anchor="middle" font-size="10" fill="#6ee7b7">DOCX → zipfile check</text>
  <text x="200" y="728" text-anchor="middle" font-size="10" fill="#6ee7b7">PPT/X → python-pptx</text>
  <text x="200" y="748" text-anchor="middle" font-size="10" fill="#ef4444">FAIL → 400</text>

  <!-- C6 -->
  <rect x="350" y="660" width="200" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="350" y="660" width="200" height="26" rx="8" fill="#065f46"/>
  <rect x="350" y="676" width="200" height="10" fill="#065f46"/>
  <text x="450" y="677" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C6 — Password</text>
  <text x="450" y="700" text-anchor="middle" font-size="10" fill="#6ee7b7">PDF only</text>
  <text x="450" y="714" text-anchor="middle" font-size="10" fill="#6ee7b7">PyMuPDF  doc.is_encrypted</text>
  <text x="450" y="728" text-anchor="middle" font-size="10" fill="#64748b">skipped for DOCX / PPT</text>
  <text x="450" y="748" text-anchor="middle" font-size="10" fill="#ef4444">FAIL → 400</text>

  <!-- C8 -->
  <rect x="600" y="660" width="200" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="600" y="660" width="200" height="26" rx="8" fill="#065f46"/>
  <rect x="600" y="676" width="200" height="10" fill="#065f46"/>
  <text x="700" y="677" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C8 — Virus Scan</text>
  <text x="700" y="700" text-anchor="middle" font-size="10" fill="#6ee7b7">ClamAV daemon</text>
  <text x="700" y="714" text-anchor="middle" font-size="10" fill="#6ee7b7">pyclamd scan_stream</text>
  <text x="700" y="728" text-anchor="middle" font-size="10" fill="#64748b">skipped if CLAMAV_ENABLED=false</text>
  <text x="700" y="748" text-anchor="middle" font-size="10" fill="#ef4444">FAIL → 400</text>

  <!-- arrow out of phase 2 -->
  <line x1="450" y1="790" x2="450" y2="813" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       CONVERSION DIAMOND
  ═══════════════════════════════════════════════ -->
  <polygon points="450,813 570,853 450,893 330,853" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="450" y="849" text-anchor="middle" font-size="11" font-weight="bold" fill="#fcd34d">needs</text>
  <text x="450" y="864" text-anchor="middle" font-size="11" font-weight="bold" fill="#fcd34d">conversion?</text>

  <!-- yes branch -->
  <line x1="570" y1="853" x2="680" y2="853" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="620" y="845" text-anchor="middle" font-size="10" fill="#f59e0b">YES (.docx/.ppt/.pptx)</text>
  <rect x="680" y="828" width="168" height="50" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="764" y="847" text-anchor="middle" font-size="11" font-weight="bold" fill="#fcd34d">LibreOffice</text>
  <text x="764" y="861" text-anchor="middle" font-size="10" fill="#94a3b8">soffice --headless</text>
  <text x="764" y="873" text-anchor="middle" font-size="10" fill="#94a3b8">sync subprocess</text>
  <!-- conversion fail -->
  <line x1="764" y1="878" x2="764" y2="916" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="700" y="916" width="128" height="30" rx="6" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.2"/>
  <text x="764" y="930" text-anchor="middle" font-size="10" fill="#ef4444">500 CONVERSION_FAILED</text>
  <text x="764" y="942" text-anchor="middle" font-size="10" fill="#ef4444">LibreOffice timeout/crash</text>
  <!-- re-join arrow from conversion box down -->
  <line x1="680" y1="853" x2="450" y2="893" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- no branch -->
  <text x="370" y="905" text-anchor="middle" font-size="10" fill="#22c55e">NO (.pdf)</text>

  <!-- arrow -->
  <line x1="450" y1="893" x2="450" y2="950" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       STORAGE BOX
  ═══════════════════════════════════════════════ -->
  <rect x="200" y="950" width="500" height="90" rx="9" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.8"/>
  <rect x="200" y="950" width="500" height="26" rx="9" fill="#0369a1"/>
  <rect x="200" y="966" width="500" height="10" fill="#0369a1"/>
  <text x="450" y="967" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Storage  —  services/storage.py</text>
  <text x="450" y="990" text-anchor="middle" font-size="11" fill="#7dd3fc">mkdir  STORAGE_ROOT / &lt;doc_id&gt; /</text>
  <text x="450" y="1006" text-anchor="middle" font-size="11" fill="#7dd3fc">write  &lt;doc_id&gt;.pdf   ←  only file kept on disk</text>
  <text x="450" y="1022" text-anchor="middle" font-size="10" fill="#64748b">DOCX/PPT: temp file written → converted → temp deleted</text>

  <!-- storage fail -->
  <line x1="700" y1="995" x2="790" y2="995" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="790" y="980" width="88" height="30" rx="6" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.2"/>
  <text x="834" y="994" text-anchor="middle" font-size="10" fill="#ef4444">500</text>
  <text x="834" y="1006" text-anchor="middle" font-size="10" fill="#ef4444">STORAGE_ERROR</text>

  <!-- arrow -->
  <line x1="450" y1="1040" x2="450" y2="1063" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       DATABASE BOX
  ═══════════════════════════════════════════════ -->
  <rect x="200" y="1063" width="500" height="100" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <rect x="200" y="1063" width="500" height="26" rx="9" fill="#065f46"/>
  <rect x="200" y="1079" width="500" height="10" fill="#065f46"/>
  <text x="450" y="1080" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PostgreSQL  —  db/models.py</text>

  <!-- documents table -->
  <rect x="218" y="1092" width="220" height="58" rx="5" fill="#1e293b" stroke="#1e3a2f" stroke-width="1"/>
  <text x="328" y="1107" text-anchor="middle" font-size="10" font-weight="bold" fill="#34d399">documents</text>
  <text x="328" y="1121" text-anchor="middle" font-size="9" fill="#6b7280">doc_id · filename · pdf_path</text>
  <text x="328" y="1133" text-anchor="middle" font-size="9" fill="#6b7280">sha256 · user_id · status=UPLOADED</text>
  <text x="328" y="1145" text-anchor="middle" font-size="9" fill="#6b7280">size · mime · tags · created_at</text>

  <!-- api_logs table -->
  <rect x="462" y="1092" width="220" height="58" rx="5" fill="#1e293b" stroke="#1e3a2f" stroke-width="1"/>
  <text x="572" y="1107" text-anchor="middle" font-size="10" font-weight="bold" fill="#34d399">api_logs</text>
  <text x="572" y="1121" text-anchor="middle" font-size="9" fill="#6b7280">method · path · status_code</text>
  <text x="572" y="1133" text-anchor="middle" font-size="9" fill="#6b7280">latency_ms · user_id · doc_id</text>
  <text x="572" y="1145" text-anchor="middle" font-size="9" fill="#6b7280">error_code · ip · created_at</text>

  <!-- arrow -->
  <line x1="450" y1="1163" x2="450" y2="1186" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       SUCCESS RESPONSE
  ═══════════════════════════════════════════════ -->
  <rect x="255" y="1186" width="390" height="100" rx="9" fill="#0f172a" stroke="#22c55e" stroke-width="1.8"/>
  <rect x="255" y="1186" width="390" height="26" rx="9" fill="#166534"/>
  <rect x="255" y="1202" width="390" height="10" fill="#166534"/>
  <text x="450" y="1203" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">200 OK  — Upload Complete</text>
  <text x="450" y="1224" text-anchor="middle" font-size="11" fill="#86efac">doc_id  ·  filename  ·  status: UPLOADED</text>
  <text x="450" y="1240" text-anchor="middle" font-size="11" fill="#86efac">pdf_path  ·  size_bytes  ·  mime_type</text>
  <text x="450" y="1256" text-anchor="middle" font-size="11" fill="#86efac">collection_id  ·  tags  ·  created_at</text>
  <text x="450" y="1272" text-anchor="middle" font-size="10" fill="#4ade80">X-Process-Time-Ms: &lt;elapsed&gt;</text>

  <!-- arrow -->
  <line x1="450" y1="1286" x2="450" y2="1309" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════
       NEXT STEP
  ═══════════════════════════════════════════════ -->
  <rect x="300" y="1309" width="300" height="54" rx="27" fill="#7c3aed"/>
  <text x="450" y="1331" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">INGESTION API</text>
  <text x="450" y="1349" text-anchor="middle" font-size="11" fill="#ddd6fe">POST /api/v1/ingest  { doc_id }</text>

  <!-- ═══════════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════════ -->
  <rect x="80" y="1390" width="740" height="168" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
  <text x="450" y="1410" text-anchor="middle" font-size="11" font-weight="bold" fill="#94a3b8">Legend</text>

  <!-- legend items col 1 -->
  <rect x="110" y="1422" width="14" height="14" rx="3" fill="#1d4ed8"/>
  <text x="132" y="1433" font-size="10" fill="#94a3b8">Phase 1 — Sequential (cheap, fail-fast)</text>

  <rect x="110" y="1444" width="14" height="14" rx="3" fill="#7c3aed"/>
  <text x="132" y="1455" font-size="10" fill="#94a3b8">Phase 2 — Parallel deep checks</text>

  <rect x="110" y="1466" width="14" height="14" rx="3" fill="#0369a1"/>
  <text x="132" y="1477" font-size="10" fill="#94a3b8">Storage — disk write</text>

  <rect x="110" y="1488" width="14" height="14" rx="3" fill="#065f46"/>
  <text x="132" y="1499" font-size="10" fill="#94a3b8">Database — Postgres write</text>

  <!-- legend items col 2 -->
  <rect x="460" y="1422" width="14" height="14" rx="3" fill="#166534"/>
  <text x="482" y="1433" font-size="10" fill="#94a3b8">Success path</text>

  <line x1="460" y1="1451" x2="474" y2="1451" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="482" y="1455" font-size="10" fill="#94a3b8">Error / rejection path</text>

  <polygon points="467,1472 474,1465 481,1472 474,1479" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="482" y="1477" font-size="10" fill="#94a3b8">Decision (needs conversion?)</text>

  <line x1="460" y1="1495" x2="474" y2="1495" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="482" y="1499" font-size="10" fill="#94a3b8">Happy-path flow</text>

  <!-- ═══════════════════════════════════════════════
       ARROW MARKERS
  ═══════════════════════════════════════════════ -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

</svg>
